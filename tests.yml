config:
  interpreter: /bin/sh
  timeout: 5s
  env:
    - HOME=./_deleteme
checks: [exitcode, stdout, stderr]

tests:
  - name: gamctx
    tests:
      - name: lint
        commands:
          - shellcheck ./gamctx

      - name: help
        commands:
          - test -n "$(./gamctx help)"

      - name: commands
        commands:
          - rm -r ./_deleteme || true
          - mkdir -p ./_deleteme
        tests:
          - name: init
            tests:
              - name: no existing .gam
                commands:
                  - ./gamctx init
                  - echo "marker" > ./_deleteme/.gam/testfile
                  - cat ./_deleteme/.gam-configs/default/testfile

              - name: existing .gam directory
                commands:
                  - mkdir -p ./_deleteme/.gam
                  - echo "existing" > ./_deleteme/.gam/marker
                  - ./gamctx init
                  - cat ./_deleteme/.gam/marker
                  - cat ./_deleteme/.gam-configs/default/marker

              - name: already initialized
                commands:
                  - mkdir -p ./_deleteme/.gam-configs/work
                  - ln -sfn .gam-configs/work ./_deleteme/.gam
                  - ./gamctx init

              - name: symlink pointing elsewhere
                commands:
                  - ln -sfn /some/other/path ./_deleteme/.gam
                  - ./gamctx init || test $? -eq 1

              - name: custom name
                commands:
                  - ./gamctx init myconfig
                  - test -d ./_deleteme/.gam-configs/myconfig

          - name: add
            tests:
              - name: new config
                commands:
                  - mkdir -p ./_deleteme/.gam-configs
                  - ./gamctx add work
                  - test -d ./_deleteme/.gam-configs/work

              - name: already exists
                commands:
                  - mkdir -p ./_deleteme/.gam-configs/work
                  - ./gamctx add work || test $? -eq 1

              - name: missing name
                commands:
                  - ./gamctx add || test $? -eq 1

          - name: use
            tests:
              - name: switch to existing config
                commands:
                  - mkdir -p ./_deleteme/.gam-configs/default
                  - mkdir -p ./_deleteme/.gam-configs/work
                  - ln -sfn .gam-configs/default ./_deleteme/.gam
                  - ./gamctx use work
                  - echo "marker" > ./_deleteme/.gam/testfile
                  - cat ./_deleteme/.gam-configs/work/testfile

              - name: config doesn't exist
                commands:
                  - mkdir -p ./_deleteme/.gam-configs/default
                  - ln -sfn .gam-configs/default ./_deleteme/.gam
                  - ./gamctx use nonexistent || test $? -eq 1

              - name: single config auto-select
                commands:
                  - mkdir -p ./_deleteme/.gam-configs/work
                  - ln -sfn .gam-configs/work ./_deleteme/.gam
                  - ./gamctx use
                  - echo "marker" > ./_deleteme/.gam/testfile
                  - cat ./_deleteme/.gam-configs/work/testfile

              - name: not initialized
                commands:
                  - ./gamctx use work || test $? -eq 1

          - name: list
            tests:
              - name: shows all configs
                commands:
                  - mkdir -p ./_deleteme/.gam-configs/default
                  - mkdir -p ./_deleteme/.gam-configs/work
                  - ln -sfn .gam-configs/work ./_deleteme/.gam
                  - ./gamctx list

              - name: not initialized
                commands:
                  - ./gamctx list || test $? -eq 1

          - name: current
            tests:
              - name: shows current config
                commands:
                  - mkdir -p ./_deleteme/.gam-configs/work
                  - ln -sfn .gam-configs/work ./_deleteme/.gam
                  - ./gamctx current

              - name: not managed
                commands:
                  - mkdir -p ./_deleteme/.gam-configs
                  - mkdir -p ./_deleteme/.gam
                  - ./gamctx current || test $? -eq 1

              - name: not initialized
                commands:
                  - ./gamctx current || test $? -eq 1

          - name: rename
            tests:
              - name: basic rename
                commands:
                  - mkdir -p ./_deleteme/.gam-configs/old
                  - ln -sfn .gam-configs/old ./_deleteme/.gam
                  - ./gamctx rename old new
                  - test -d ./_deleteme/.gam-configs/new
                  - test ! -d ./_deleteme/.gam-configs/old

              - name: rename active config
                commands:
                  - mkdir -p ./_deleteme/.gam-configs/old
                  - ln -sfn .gam-configs/old ./_deleteme/.gam
                  - echo "marker" > ./_deleteme/.gam/testfile
                  - ./gamctx rename old new
                  - cat ./_deleteme/.gam/testfile
                  - ./gamctx current

              - name: old doesn't exist
                commands:
                  - mkdir -p ./_deleteme/.gam-configs
                  - ./gamctx rename nonexistent new || test $? -eq 1

              - name: new already exists
                commands:
                  - mkdir -p ./_deleteme/.gam-configs/old
                  - mkdir -p ./_deleteme/.gam-configs/new
                  - ./gamctx rename old new || test $? -eq 1

              - name: missing arguments
                commands:
                  - mkdir -p ./_deleteme/.gam-configs
                  - ./gamctx rename || test $? -eq 1
                  - ./gamctx rename old || test $? -eq 1

              - name: invalid names
                commands:
                  - mkdir -p ./_deleteme/.gam-configs/old
                  - ./gamctx rename old "invalid name" || test $? -eq 1
                  - ./gamctx rename "invalid name" new || test $? -eq 1

          - name: no args
            tests:
              - name: single config auto-select
                commands:
                  - mkdir -p ./_deleteme/.gam-configs/only
                  - ./gamctx
                  - readlink ./_deleteme/.gam | grep -q only

          - name: validation
            tests:
              - name: empty name
                commands:
                  - mkdir -p ./_deleteme/.gam-configs
                  - ./gamctx add "" || test $? -eq 1

              - name: invalid chars
                commands:
                  - mkdir -p ./_deleteme/.gam-configs
                  - ./gamctx add "my config" || test $? -eq 1

              - name: path traversal
                commands:
                  - mkdir -p ./_deleteme/.gam-configs
                  - ./gamctx add "../../../etc" || test $? -eq 1

              - name: starts with hyphen
                commands:
                  - mkdir -p ./_deleteme/.gam-configs
                  - ./gamctx add "-foo" || test $? -eq 1

              - name: dot
                commands:
                  - mkdir -p ./_deleteme/.gam-configs
                  - ./gamctx add "." || test $? -eq 1

              - name: valid names
                commands:
                  - mkdir -p ./_deleteme/.gam-configs
                  - ./gamctx add "valid-name_123"
                  - test -d ./_deleteme/.gam-configs/valid-name_123

          - name: unknown command
            commands:
              - ./gamctx badcmd || test $? -eq 1
