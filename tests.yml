config:
  interpreter: /bin/sh
  timeout: 5s
  env:
    - HOME=./_deleteme
    - PATH=/opt/homebrew/bin:/usr/local/bin:/usr/bin:/bin
checks: [exitcode, stdout, stderr]

tests:
  - name: gamctx
    tests:
      - name: lint
        commands:
          - shellcheck ./gamctx

      - name: help
        commands:
          - test -n "$(./gamctx help)"

      - name: commands
        commands:
          - rm -r $HOME || true
          - mkdir -p $HOME
        tests:
          - name: init
            tests:
              - name: no existing .gam
                commands:
                  - ./gamctx init
                  - echo "marker" > $HOME/.gam/testfile
                  - cat $HOME/.gam-configs/default/testfile

              - name: existing .gam directory
                commands:
                  - mkdir -p $HOME/.gam
                  - echo "existing" > $HOME/.gam/marker
                  - ./gamctx init
                  - cat $HOME/.gam/marker
                  - cat $HOME/.gam-configs/default/marker

              - name: already initialized
                commands:
                  - mkdir -p $HOME/.gam-configs/work
                  - ln -sfn .gam-configs/work $HOME/.gam
                  - ./gamctx init

              - name: symlink pointing elsewhere
                commands:
                  - ln -sfn /some/other/path $HOME/.gam
                  - ./gamctx init || test $? -eq 1

              - name: custom name
                commands:
                  - ./gamctx init myconfig
                  - test -d $HOME/.gam-configs/myconfig

          - name: add
            tests:
              - name: new config
                commands:
                  - mkdir -p $HOME/.gam-configs
                  - ./gamctx add work
                  - test -d $HOME/.gam-configs/work

              - name: already exists
                commands:
                  - mkdir -p $HOME/.gam-configs/work
                  - ./gamctx add work || test $? -eq 1

              - name: missing name
                commands:
                  - ./gamctx add || test $? -eq 1

          - name: use
            tests:
              - name: switch to existing config
                commands:
                  - mkdir -p $HOME/.gam-configs/default
                  - mkdir -p $HOME/.gam-configs/work
                  - ln -sfn .gam-configs/default $HOME/.gam
                  - ./gamctx use work
                  - echo "marker" > $HOME/.gam/testfile
                  - cat $HOME/.gam-configs/work/testfile

              - name: config doesn't exist
                commands:
                  - mkdir -p $HOME/.gam-configs/default
                  - ln -sfn .gam-configs/default $HOME/.gam
                  - ./gamctx use nonexistent || test $? -eq 1

              - name: single config auto-select
                commands:
                  - mkdir -p $HOME/.gam-configs/work
                  - ln -sfn .gam-configs/work $HOME/.gam
                  - ./gamctx use
                  - echo "marker" > $HOME/.gam/testfile
                  - cat $HOME/.gam-configs/work/testfile

              - name: not initialized
                commands:
                  - ./gamctx use work || test $? -eq 1

          - name: list
            tests:
              - name: shows all configs
                commands:
                  - mkdir -p $HOME/.gam-configs/default
                  - mkdir -p $HOME/.gam-configs/work
                  - ln -sfn .gam-configs/work $HOME/.gam
                  - ./gamctx list

              - name: shows config info
                commands:
                  - mkdir -p $HOME/.gam-configs/default
                  - mkdir -p $HOME/.gam-configs/work
                  - printf 'domain = example.com\nadmin_email = admin@example.com\ncustomer_id = C01234\n' > $HOME/.gam-configs/work/gam.cfg
                  - ln -sfn .gam-configs/work $HOME/.gam
                  - ./gamctx list

              - name: not initialized
                commands:
                  - ./gamctx list || test $? -eq 1

          - name: current
            tests:
              - name: shows current config
                commands:
                  - mkdir -p $HOME/.gam-configs/work
                  - ln -sfn .gam-configs/work $HOME/.gam
                  - ./gamctx current

              - name: not managed
                commands:
                  - mkdir -p $HOME/.gam-configs
                  - mkdir -p $HOME/.gam
                  - ./gamctx current || test $? -eq 1

              - name: not initialized
                commands:
                  - ./gamctx current || test $? -eq 1

          - name: move
            tests:
              - name: basic move
                commands:
                  - mkdir -p $HOME/.gam-configs/old
                  - ln -sfn .gam-configs/old $HOME/.gam
                  - ./gamctx move old new
                  - test -d $HOME/.gam-configs/new
                  - test ! -d $HOME/.gam-configs/old

              - name: move active config
                commands:
                  - mkdir -p $HOME/.gam-configs/old
                  - ln -sfn .gam-configs/old $HOME/.gam
                  - echo "marker" > $HOME/.gam/testfile
                  - ./gamctx move old new
                  - cat $HOME/.gam/testfile
                  - ./gamctx current

              - name: old doesn't exist
                commands:
                  - mkdir -p $HOME/.gam-configs
                  - ./gamctx move nonexistent new || test $? -eq 1

              - name: new already exists
                commands:
                  - mkdir -p $HOME/.gam-configs/old
                  - mkdir -p $HOME/.gam-configs/new
                  - ./gamctx move old new || test $? -eq 1

              - name: missing arguments
                commands:
                  - mkdir -p $HOME/.gam-configs
                  - ./gamctx move || test $? -eq 1
                  - ./gamctx move old || test $? -eq 1

              - name: invalid names
                commands:
                  - mkdir -p $HOME/.gam-configs/old
                  - ./gamctx move old "invalid name" || test $? -eq 1
                  - ./gamctx move "invalid name" new || test $? -eq 1

          - name: copy
            tests:
              - name: basic copy
                commands:
                  - mkdir -p $HOME/.gam-configs/src
                  - echo "data" > $HOME/.gam-configs/src/testfile
                  - ./gamctx copy src dest
                  - test -d $HOME/.gam-configs/src
                  - test -d $HOME/.gam-configs/dest
                  - cat $HOME/.gam-configs/dest/testfile

              - name: src doesn't exist
                commands:
                  - mkdir -p $HOME/.gam-configs
                  - ./gamctx copy nonexistent dest || test $? -eq 1

              - name: dest already exists
                commands:
                  - mkdir -p $HOME/.gam-configs/src
                  - mkdir -p $HOME/.gam-configs/dest
                  - ./gamctx copy src dest || test $? -eq 1

              - name: missing arguments
                commands:
                  - mkdir -p $HOME/.gam-configs
                  - ./gamctx copy || test $? -eq 1
                  - ./gamctx copy src || test $? -eq 1

              - name: invalid names
                commands:
                  - mkdir -p $HOME/.gam-configs/src
                  - ./gamctx copy src "invalid name" || test $? -eq 1
                  - ./gamctx copy "invalid name" dest || test $? -eq 1

          - name: no args
            tests:
              - name: single config auto-select
                commands:
                  - mkdir -p $HOME/.gam-configs/only
                  - ./gamctx
                  - readlink $HOME/.gam | grep -q only

          - name: validation
            tests:
              - name: empty name
                commands:
                  - mkdir -p $HOME/.gam-configs
                  - ./gamctx add "" || test $? -eq 1

              - name: invalid chars
                commands:
                  - mkdir -p $HOME/.gam-configs
                  - ./gamctx add "my config" || test $? -eq 1

              - name: path traversal
                commands:
                  - mkdir -p $HOME/.gam-configs
                  - ./gamctx add "../../../etc" || test $? -eq 1

              - name: starts with hyphen
                commands:
                  - mkdir -p $HOME/.gam-configs
                  - ./gamctx add "-foo" || test $? -eq 1

              - name: dot
                commands:
                  - mkdir -p $HOME/.gam-configs
                  - ./gamctx add "." || test $? -eq 1

              - name: valid names
                commands:
                  - mkdir -p $HOME/.gam-configs
                  - ./gamctx add "valid-name_123"
                  - test -d $HOME/.gam-configs/valid-name_123

          - name: unknown command
            commands:
              - ./gamctx badcmd || test $? -eq 1
